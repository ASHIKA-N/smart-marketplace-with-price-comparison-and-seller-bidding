services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aroundly
      POSTGRES_USER: aroundly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aroundly}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroundly"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
